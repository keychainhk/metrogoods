<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrogoods & Keychain Hong Kong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface-glass: rgba(15, 19, 28, 0.82);
      --surface-card: #161b26;
      --surface-card-hover: #1c2230;
      --surface-control: #0d111a;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #ef233c;
      --accent-hover: #d90429;
      --accent-soft: rgba(239, 35, 60, 0.16);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.16);
      --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.75);
      --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.35);
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: var(--footer-height, 56px);
      display: flex;
      flex-direction: column;
      background-color: #05070c;
      background-image:
          linear-gradient(180deg, rgba(5, 7, 12, 0.50) 0%, rgba(8, 11, 18, 0.58) 50%, rgba(5, 7, 12, 0.68) 100%),
          url('https://na.cx/i/pGK1VCg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      line-height: 1.5;
    }

    /* Top Logo Header */
    .site-header {
      width: 100%;
      padding: 32px 20px 18px;
      text-align: center;
    }

    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 92%;
    }

    .logo-wrapper img {
      max-height: 76px;
      width: auto;
      max-width: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.75));
    }

    .site-footer {
      position: fixed;
      inset: auto 0 0;
      z-index: 100;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      background: #080a10;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
    }

    .social-section, .social-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .social-label {
      font-size: 0.78rem;
      font-weight: 600;
    }

    @media (max-width: 680px) {
      body {
        padding-bottom: var(--footer-height, 192px);
      }

      .site-footer {
        max-height: 55dvh;
        overflow-y: auto;
        transition: transform 180ms ease, visibility 180ms;
      }

      .site-footer.is-hidden {
        visibility: hidden;
        transform: translateY(100%);
      }

      .social-section {
        flex-direction: column;
        gap: 4px;
      }

      .social-buttons {
        display: grid;
        width: min(100%, 240px);
        gap: 4px;
      }

      .social-buttons .social-btn {
        justify-content: center;
        min-height: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .site-footer {
        transition: none;
      }
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.78rem;
      color: #ffffff;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .social-btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .social-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .btn-whatsapp {
      background: #25d366;
    }

    .btn-facebook {
      background: #1877f2;
    }

    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .page-title-group {
      margin-top: 14px;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    .page-title-group h1 {
      font-size: clamp(1.25rem, 3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .page-title-group p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }

    /* Main Dark Glass Container */
    .container {
      width: 100%;
      max-width: 1140px;
      margin: 8px auto 32px;
      padding: 0 16px;
      flex: 1;
    }

    .directory-panel {
      background: var(--surface-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 24px;
    }

    /* Controls: Zone Tabs + Search + District */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .zone-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .zone-btn {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background: var(--surface-control);
      color: var(--text-secondary);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .zone-btn:hover {
      border-color: var(--accent);
      color: #ffffff;
      background: #181e2c;
      transform: translateY(-1px);
    }

    .zone-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(239, 35, 60, 0.38);
    }

    .zone-count {
      font-size: 0.78rem;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
    }

    .zone-btn.active .zone-count {
      background: rgba(0, 0, 0, 0.25);
    }

    .filter-inputs {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 12px;
    }

    @media (max-width: 680px) {
      .filter-inputs {
        grid-template-columns: 1fr;
      }
      .directory-panel {
        padding: 18px 14px;
      }
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input,
    .district-select {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--surface-control);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-primary);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input {
      padding: 0 38px 0 40px;
    }

    .district-select {
      padding: 0 14px;
      cursor: pointer;
    }

    .district-select option {
      background: #121620;
      color: #f8fafc;
    }

    .search-input:focus,
    .district-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(239, 35, 60, 0.22);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .clear-btn.visible {
      display: flex;
    }

    /* Results Meta */
    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Location Cards Grid */
    .locations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .location-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .location-card:hover {
      transform: translateY(-2px);
      background: var(--surface-card-hover);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
      border-color: rgba(239, 35, 60, 0.45);
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .badge-zone {
      background: var(--accent-soft);
      color: #ff6b7a;
      border: 1px solid rgba(239, 35, 60, 0.25);
    }

    .badge-district {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .shop-name-c {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .shop-name-e {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .address-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      font-size: 0.9rem;
    }

    .address-c {
      color: #e2e8f0;
      font-weight: 500;
    }

    .address-e {
      color: var(--text-muted);
      font-size: 0.83rem;
      margin-top: 3px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .action-link {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-link:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

    .empty-state button {
      margin-top: 12px;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    /* Stock Disclaimer Notice */
    .disclaimer-notice {
      max-width: 1140px;
      width: 100%;
      margin: 0 auto 36px;
      padding: 0 20px;
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      line-height: 1.55;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: calc(var(--footer-height, 56px) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

  <script>
    {
      const footer = document.getElementById('socialFooter');
      const mobile = window.matchMedia('(max-width: 680px)');
      const scrollPosition = () => {
        const page = document.scrollingElement;
        const maxScroll = page.scrollHeight - page.clientHeight;
        return Math.max(0, Math.min(window.scrollY, maxScroll));
      };
      let previousScroll = scrollPosition();

      new ResizeObserver(() => {
        document.body.style.setProperty('--footer-height', footer.offsetHeight + 'px');
      }).observe(footer);

      const showFooter = () => {
        previousScroll = scrollPosition();
        footer.classList.remove('is-hidden');
        footer.inert = false;
      };

      mobile.addEventListener('change', showFooter);
      window.addEventListener('pageshow', showFooter);
      window.addEventListener('scroll', () => {
        const currentScroll = scrollPosition();
        if (mobile.matches && currentScroll !== previousScroll) {
          const hide = currentScroll > previousScroll && !footer.contains(document.activeElement);
          footer.classList.toggle('is-hidden', hide);
          footer.inert = hide;
        }
        previousScroll = currentScroll;
      }, { passive: true });
    }
  </script>

  <script>
    const CSV_URL = 'saleslocation.csv';

    let allLocations = [];
    let selectedZone = 'ALL';
    let selectedDistrict = 'ALL';
    let searchQuery = '';

    // RFC-4180 compliant CSV parser supporting quoted fields with commas
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          if (currentVal.length > 0 || currentRow.length > 0) {
            currentRow.push(currentVal.trim());
            rows.push(currentRow);
          }
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal.length > 0 || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        rows.push(currentRow);
      }

      if (rows.length < 2) return [];
      const headers = rows[0].map(h => h.replace(/^\uFEFF/, '').trim());
      return rows.slice(1).map(row => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = row[idx] || '';
        });
        return obj;
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function copyAddress(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Address copied 已複製地址');
      }).catch(() => {
        showToast('Failed 無法複製');
      });
    }

    function buildZoneTabs() {
      const zoneTabsEl = document.getElementById('zoneTabs');
      const zoneMap = new Map();

      allLocations.forEach(item => {
        const key = item.zone_c;
        if (!zoneMap.has(key)) {
          zoneMap.set(key, { zone_c: item.zone_c, zone_e: item.zone_e, count: 0 });
        }
        zoneMap.get(key).count++;
      });

      const tabs = [
        { key: 'ALL', label: 'All 全部地點', count: allLocations.length },
        ...Array.from(zoneMap.values()).map(z => ({
          key: z.zone_c,
          label: `${z.zone_c} · ${z.zone_e}`,
          count: z.count
        }))
      ];

      zoneTabsEl.innerHTML = tabs.map(tab => `
        <button
          type="button"
          class="zone-btn ${selectedZone === tab.key ? 'active' : ''}"
          data-zone="${escapeHTML(tab.key)}"
        >
          <span>${escapeHTML(tab.label)}</span>
          <span class="zone-count">${tab.count}</span>
        </button>
      `).join('');

      zoneTabsEl.querySelectorAll('.zone-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedZone = btn.dataset.zone;
          selectedDistrict = 'ALL';
          buildZoneTabs();
          buildDistrictOptions();
          renderLocations();
        });
      });
    }

    function buildDistrictOptions() {
      const selectEl = document.getElementById('districtSelect');
      const filteredByZone = selectedZone === 'ALL'
        ? allLocations
        : allLocations.filter(item => item.zone_c === selectedZone);

      const districts = new Map();
      filteredByZone.forEach(item => {
        if (!districts.has(item.district_c)) {
          districts.set(item.district_c, `${item.district_c} · ${item.district_e}`);
        }
      });

      selectEl.innerHTML = `<option value="ALL">All Districts 所有地區 (${districts.size})</option>` +
        Array.from(districts.entries())
          .map(([val, label]) => `<option value="${escapeHTML(val)}">${escapeHTML(label)}</option>`)
          .join('');

      selectEl.value = selectedDistrict;
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderLocations() {
      const gridEl = document.getElementById('locationsGrid');
      const countEl = document.getElementById('resultsCount');
      const q = searchQuery.trim().toLowerCase();

      const filtered = allLocations.filter(item => {
        const matchZone = selectedZone === 'ALL' || item.zone_c === selectedZone;
        const matchDistrict = selectedDistrict === 'ALL' || item.district_c === selectedDistrict;
        const matchQuery = !q || [
          item.zone_c, item.zone_e,
          item.district_c, item.district_e,
          item.shopname_c, item.shopname_e,
          item.address_c, item.address_e
        ].some(field => field.toLowerCase().includes(q));

        return matchZone && matchDistrict && matchQuery;
      });

      countEl.textContent = `Showing ${filtered.length} of ${allLocations.length} locations 顯示 ${filtered.length} / ${allLocations.length} 個銷售點`;

      if (filtered.length === 0) {
        gridEl.innerHTML = `
          <div class="empty-state">
            <p>No matching 找不到符合地點</p>
            <button type="button" id="resetFiltersBtn">Reset Filter 重設篩選</button>
          </div>
        `;
        document.getElementById('resetFiltersBtn').addEventListener('click', () => {
          selectedZone = 'ALL';
          selectedDistrict = 'ALL';
          searchQuery = '';
          document.getElementById('searchInput').value = '';
          document.getElementById('clearSearchBtn').classList.remove('visible');
          buildZoneTabs();
          buildDistrictOptions();
          renderLocations();
        });
        return;
      }

      gridEl.innerHTML = filtered.map(item => {
        const mapsQuery = encodeURIComponent(`${item.shopname_c} ${item.address_c} Hong Kong`);
        const mapHref = (item.gmap_link || '').trim() || `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;
        const fullCopyText = [
          item.shopname_c,
          item.address_c,
          item.shopname_e,
          item.address_e
        ].filter(Boolean).join('\n');

        return `
          <article class="location-card">
            <div>
              <div class="card-badges">
                <span class="badge badge-zone">${escapeHTML(item.zone_c)} · ${escapeHTML(item.zone_e)}</span>
                <span class="badge badge-district">${escapeHTML(item.district_c)} · ${escapeHTML(item.district_e)}</span>
              </div>
              <h2 class="shop-name-c">${escapeHTML(item.shopname_c)}</h2>
              <div class="shop-name-e">${escapeHTML(item.shopname_e)}</div>
              <div class="address-block">
                <div class="address-c">${escapeHTML(item.address_c)}</div>
                <div class="address-e">${escapeHTML(item.address_e)}</div>
              </div>
            </div>
            <div class="card-actions">
              <a class="action-link" href="${escapeHTML(mapHref)}" target="_blank" rel="noopener noreferrer">
                📍 Map 地圖
              </a>
              <button type="button" class="action-link copy-addr-btn" data-copy="${escapeHTML(fullCopyText)}">
                📋 Copy 複製地址
              </button>
            </div>
          </article>
        `;
      }).join('');

      gridEl.querySelectorAll('.copy-addr-btn').forEach(btn => {
        btn.addEventListener('click', () => copyAddress(btn.dataset.copy));
      });
    }

    async function init() {
      const countEl = document.getElementById('resultsCount');
      const gridEl = document.getElementById('locationsGrid');

      try {
        const response = await fetch(`${CSV_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const csvText = await response.text();
        allLocations = parseCSV(csvText);

        if (allLocations.length === 0) {
          throw new Error('CSV is empty');
        }
      } catch (err) {
        countEl.textContent = 'Sales location list not loaded successfully';
        gridEl.innerHTML = `
          <div class="empty-state">
            <p>Sales location list not loaded successfully</p>
          </div>
        `;
        return;
      }

      buildZoneTabs();
      buildDistrictOptions();
      renderLocations();

      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      const districtSelect = document.getElementById('districtSelect');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        clearBtn.classList.toggle('visible', searchQuery.length > 0);
        renderLocations();
      });

      clearBtn.addEventListener('click', () => {
        searchQuery = '';
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        searchInput.focus();
        renderLocations();
      });

      districtSelect.addEventListener('change', (e) => {
        selectedDistrict = e.target.value;
        renderLocations();
      });
    }

    init();
  </script>
</body>
</html>
